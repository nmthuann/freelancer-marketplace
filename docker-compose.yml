version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: freelancer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  user-service:
    build:
      context: .
      dockerfile: apps/user/Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: freelancer
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  order-service:
    build:
      context: .
      dockerfile: apps/order/Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: freelancer
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
